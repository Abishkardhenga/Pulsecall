name: Build and Publish iOS App

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      distribution_mode:
        description: "iOS distribution mode (development or testflight)"
        required: false
        default: "development"
        type: choice
        options:
          - development
          - testflight

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect iOS project structure
        id: inspect_ios
        run: |
          WORKSPACE_PATH=$(find . -maxdepth 3 -name "*.xcworkspace" -not -path "*/Pods/*" -not -path "*.xcodeproj/*" | head -n 1 || true)
          PROJECT_PATH=$(find . -maxdepth 3 -name "*.xcodeproj" | head -n 1 || true)

          echo "workspace_path=${WORKSPACE_PATH}" >> "$GITHUB_OUTPUT"
          echo "project_path=${PROJECT_PATH}" >> "$GITHUB_OUTPUT"

          if [ -z "$WORKSPACE_PATH" ] && [ -z "$PROJECT_PATH" ]; then
            echo "has_ios_project=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No native iOS project (.xcworkspace or .xcodeproj) found; skipping iOS build cleanly so Android builds are unaffected."
            {
              echo "### iOS Build Skipped — No iOS Project Present"
              echo ""
              echo "This repository currently contains only a **native Android** project (\`app/build.gradle.kts\`). No \`.xcodeproj\`, \`.xcworkspace\`, \`Podfile\`, or iOS target was detected, so no IPA or release was fabricated."
              echo ""
              echo "When you add an iOS Xcode project to this repository, configure these GitHub Actions secrets for signed IPA / TestFlight builds:"
              echo "- \`APPLE_CERTIFICATE_BASE64\` & \`APPLE_CERTIFICATE_PASSWORD\`"
              echo "- \`APPLE_PROVISIONING_PROFILE_BASE64\`"
              echo "- \`APPLE_EXPORT_OPTIONS_PLIST_BASE64\`"
              echo "- For TestFlight: \`APP_STORE_CONNECT_API_KEY_ID\`, \`APP_STORE_CONNECT_ISSUER_ID\`, \`APP_STORE_CONNECT_PRIVATE_KEY\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "has_ios_project=true" >> "$GITHUB_OUTPUT"
          if [ -f "ios/Podfile" ] || [ -f "Podfile" ]; then
            echo "has_podfile=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_podfile=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install CocoaPods dependencies
        if: steps.inspect_ios.outputs.has_ios_project == 'true' && steps.inspect_ios.outputs.has_podfile == 'true'
        run: |
          if [ -f "ios/Podfile" ]; then
            pod install --project-directory=ios
          elif [ -f "Podfile" ]; then
            pod install
          fi

      - name: Check Apple signing credentials
        if: steps.inspect_ios.outputs.has_ios_project == 'true'
        id: check_apple_creds
        env:
          APPLE_CERT_B64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERT_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROFILE_B64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          MISSING=""
          [ -z "$APPLE_CERT_B64" ] && MISSING="${MISSING} APPLE_CERTIFICATE_BASE64"
          [ -z "$APPLE_CERT_PASS" ] && MISSING="${MISSING} APPLE_CERTIFICATE_PASSWORD"
          [ -z "$APPLE_PROFILE_B64" ] && MISSING="${MISSING} APPLE_PROVISIONING_PROFILE_BASE64"

          if [ -n "$MISSING" ]; then
            echo "has_signing_creds=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Missing Apple Developer signing secrets:${MISSING}. Running unsigned build verification only; no installable IPA can be exported without Apple signing credentials."
            {
              echo "### iOS Signing Secrets Missing — Unsigned Verification Only"
              echo ""
              echo "Missing secrets:${MISSING}"
              echo "No installable IPA or release will be published until Apple signing credentials are configured."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "has_signing_creds=true" >> "$GITHUB_OUTPUT"
          DIST_MODE="${{ inputs.distribution_mode || 'development' }}"
          if [ "$DIST_MODE" = "testflight" ] && { [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_PRIVATE_KEY" ]; }; then
            echo "has_asc_creds=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TestFlight selected, but App Store Connect API secrets are missing; skipping TestFlight upload."
          else
            echo "has_asc_creds=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Unsigned iOS build verification (no signing credentials)
        if: steps.inspect_ios.outputs.has_ios_project == 'true' && steps.check_apple_creds.outputs.has_signing_creds != 'true'
        env:
          WORKSPACE_PATH: ${{ steps.inspect_ios.outputs.workspace_path }}
          PROJECT_PATH: ${{ steps.inspect_ios.outputs.project_path }}
        run: |
          if [ -n "$WORKSPACE_PATH" ]; then
            SCHEME=$(xcodebuild -list -json -workspace "$WORKSPACE_PATH" | python3 -c "import sys,json; print(json.load(sys.stdin)['workspace']['schemes'][0])")
            xcodebuild -workspace "$WORKSPACE_PATH" -scheme "$SCHEME" -configuration Debug -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
          else
            SCHEME=$(xcodebuild -list -json -project "$PROJECT_PATH" | python3 -c "import sys,json; print(json.load(sys.stdin)['project']['schemes'][0])")
            xcodebuild -project "$PROJECT_PATH" -scheme "$SCHEME" -configuration Debug -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
          fi

      - name: Set up temporary Apple keychain and provisioning profile
        if: steps.inspect_ios.outputs.has_ios_project == 'true' && steps.check_apple_creds.outputs.has_signing_creds == 'true'
        id: setup_signing
        env:
          APPLE_CERT_B64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERT_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROFILE_B64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH="${RUNNER_TEMP}/build.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          CERT_PATH="${RUNNER_TEMP}/signing-cert.p12"
          PROFILE_PATH="${RUNNER_TEMP}/provisioning.mobileprovision"

          echo "$APPLE_CERT_B64" | base64 --decode > "$CERT_PATH"
          echo "$APPLE_PROFILE_B64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERT_PASS" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -o - -)
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          echo "keychain_path=${KEYCHAIN_PATH}" >> "$GITHUB_OUTPUT"
          echo "profile_uuid=${PROFILE_UUID}" >> "$GITHUB_OUTPUT"

      - name: Archive and export signed iOS IPA
        if: steps.inspect_ios.outputs.has_ios_project == 'true' && steps.check_apple_creds.outputs.has_signing_creds == 'true'
        id: build_ipa
        env:
          WORKSPACE_PATH: ${{ steps.inspect_ios.outputs.workspace_path }}
          PROJECT_PATH: ${{ steps.inspect_ios.outputs.project_path }}
          EXPORT_PLIST_B64: ${{ secrets.APPLE_EXPORT_OPTIONS_PLIST_BASE64 }}
        run: |
          ARCHIVE_PATH="${RUNNER_TEMP}/App.xcarchive"
          EXPORT_DIR="${RUNNER_TEMP}/ipa-export"
          EXPORT_PLIST="${RUNNER_TEMP}/ExportOptions.plist"
          mkdir -p "$EXPORT_DIR"

          if [ -z "$EXPORT_PLIST_B64" ]; then
            echo "::error::APPLE_EXPORT_OPTIONS_PLIST_BASE64 secret is required to export a signed IPA."
            exit 1
          fi
          echo "$EXPORT_PLIST_B64" | base64 --decode > "$EXPORT_PLIST"

          if [ -n "$WORKSPACE_PATH" ]; then
            SCHEME=$(xcodebuild -list -json -workspace "$WORKSPACE_PATH" | python3 -c "import sys,json; print(json.load(sys.stdin)['workspace']['schemes'][0])")
            xcodebuild -workspace "$WORKSPACE_PATH" -scheme "$SCHEME" -configuration Release -sdk iphoneos -archivePath "$ARCHIVE_PATH" archive
          else
            SCHEME=$(xcodebuild -list -json -project "$PROJECT_PATH" | python3 -c "import sys,json; print(json.load(sys.stdin)['project']['schemes'][0])")
            xcodebuild -project "$PROJECT_PATH" -scheme "$SCHEME" -configuration Release -sdk iphoneos -archivePath "$ARCHIVE_PATH" archive
          fi

          xcodebuild -exportArchive -archivePath "$ARCHIVE_PATH" -exportOptionsPlist "$EXPORT_PLIST" -exportPath "$EXPORT_DIR"

          IPA_PATH=$(find "$EXPORT_DIR" -maxdepth 1 -type f -name "*.ipa" | head -n 1 || true)
          if [ -z "$IPA_PATH" ] || [ ! -s "$IPA_PATH" ]; then
            echo "::error::Signed IPA file was not produced or is empty."
            exit 1
          fi

          echo "ipa_path=${IPA_PATH}" >> "$GITHUB_OUTPUT"
          echo "Verified IPA: ${IPA_PATH}"

      - name: Upload iOS IPA artifact
        if: steps.build_ipa.outputs.ipa_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-ipa
          path: ${{ steps.build_ipa.outputs.ipa_path }}
          if-no-files-found: error

      - name: Upload to App Store Connect (TestFlight)
        if: inputs.distribution_mode == 'testflight' && steps.build_ipa.outputs.ipa_path != '' && steps.check_apple_creds.outputs.has_asc_creds == 'true'
        env:
          IPA_PATH: ${{ steps.build_ipa.outputs.ipa_path }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          KEYS_DIR="${RUNNER_TEMP}/private_keys"
          mkdir -p "$KEYS_DIR"
          echo "$ASC_PRIVATE_KEY" > "${KEYS_DIR}/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Prepare iOS release asset
        if: steps.build_ipa.outputs.ipa_path != ''
        id: prepare_ios_asset
        env:
          IPA_PATH: ${{ steps.build_ipa.outputs.ipa_path }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SANITIZED_REPO=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g; s/-\+/-/g; s/^-//; s/-$//')
          if [ -z "$SANITIZED_REPO" ]; then
            SANITIZED_REPO="ios-app"
          fi

          ASSET_DIR=$(mktemp -d "${RUNNER_TEMP}/ios-release-asset-XXXXXX")
          ASSET_FILENAME="${SANITIZED_REPO}-ios-build-${GITHUB_RUN_NUMBER}.ipa"
          ASSET_PATH="${ASSET_DIR}/${ASSET_FILENAME}"
          cp "$IPA_PATH" "$ASSET_PATH"

          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_filename=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"

      - name: Publish iOS IPA to GitHub Releases
        if: steps.prepare_ios_asset.outputs.asset_path != ''
        id: publish_ios_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_ios_asset.outputs.asset_path }}
          ASSET_FILENAME: ${{ steps.prepare_ios_asset.outputs.asset_filename }}
        run: |
          gh --version
          RELEASE_TAG="mobile-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-ios"
          RELEASE_TITLE="Mobile App Build #${GITHUB_RUN_NUMBER}"

          RELEASE_NOTES=$(cat <<EOF
          Automated Mobile App Build #${GITHUB_RUN_NUMBER}

          - **Android Build Status:** Independent workflow (\`.github/workflows/build-android.yml\`)
          - **iOS Build Status:** Succeeded (Signed IPA)
          - **Source Commit SHA:** \`${GITHUB_SHA}\`
          - **Workflow Run Number:** ${GITHUB_RUN_NUMBER}
          - **Workflow Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Available Downloadable Asset:** \`${ASSET_FILENAME}\`
          EOF
          )

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "$GITHUB_SHA" \
            --latest

      - name: Clean up temporary Apple signing resources
        if: always()
        env:
          KEYCHAIN_PATH: ${{ steps.setup_signing.outputs.keychain_path }}
          PROFILE_UUID: ${{ steps.setup_signing.outputs.profile_uuid }}
        run: |
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "${RUNNER_TEMP}/signing-cert.p12" "${RUNNER_TEMP}/provisioning.mobileprovision" "${RUNNER_TEMP}/ExportOptions.plist"
          rm -rf "${RUNNER_TEMP}/private_keys"
          if [ -n "$PROFILE_UUID" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          fi
