name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"

          VERSION_OUTPUT=$(java -version 2>&1)
          VERSION_RAW=$(echo "$VERSION_OUTPUT" | head -n 1 | sed -n 's/.*version "\([^"]*\)".*/\1/p')
          if [ -z "$VERSION_RAW" ]; then
            echo "::error::Failed to detect active Java version."
            exit 1
          fi

          MAJOR_VERSION=$(echo "$VERSION_RAW" | cut -d. -f1 | sed 's/[^0-9].*$//')
          if [ "$MAJOR_VERSION" = "1" ]; then
            MAJOR_VERSION=$(echo "$VERSION_RAW" | cut -d. -f2 | sed 's/[^0-9].*$//')
          fi

          if ! echo "$MAJOR_VERSION" | grep -Eq '^[0-9]+$'; then
            echo "::error::Unable to parse Java major version from: $VERSION_RAW"
            exit 1
          fi

          echo "Detected Java major version: $MAJOR_VERSION"
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java $MAJOR_VERSION."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "Debug keystore already exists."
          else
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            if [ ! -x "$KEYTOOL_BIN" ]; then
              echo "::error::keytool not found in configured Java 17 installation at $KEYTOOL_BIN"
              exit 1
            fi

            "$KEYTOOL_BIN" -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "./debug.keystore" ] || [ ! -s "./debug.keystore" ]; then
            echo "::error::Temporary debug keystore could not be created at ./debug.keystore"
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found at $EXPECTED_APK"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk" || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::Debug APK at $EXPECTED_APK is empty."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "::error::Selected file $EXPECTED_APK does not have the .apk extension."
              exit 1
              ;;
          esac

          echo "Verified debug APK: $EXPECTED_APK ($(wc -c < "$EXPECTED_APK") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SOURCE_APK" ] || [ ! -s "$SOURCE_APK" ]; then
            echo "::error::Verified APK missing or empty at $SOURCE_APK"
            exit 1
          fi

          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SANITIZED_REPO=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g; s/-\+/-/g; s/^-//; s/-$//')
          if [ -z "$SANITIZED_REPO" ]; then
            SANITIZED_REPO="android-app"
          fi

          RELEASE_ASSET_DIR=$(mktemp -d "${RUNNER_TEMP:-/tmp}/release-asset-XXXXXX")
          ASSET_FILENAME="${SANITIZED_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${RELEASE_ASSET_DIR}/${ASSET_FILENAME}"

          cp "$SOURCE_APK" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Failed to prepare release asset at $ASSET_PATH"
            exit 1
          fi

          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_filename=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: ${ASSET_FILENAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          ASSET_FILENAME: ${{ steps.prepare_asset.outputs.asset_filename }}
        run: |
          gh --version

          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Prepared release asset is missing or empty."
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "::error::Prepared release asset is not an .apk file: $ASSET_PATH"
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

          RELEASE_NOTES=$(cat <<EOF
          This is an automatically generated debug APK built by GitHub Actions.

          - GitHub Actions Run Number: ${GITHUB_RUN_NUMBER}
          - GitHub Actions Run Attempt: ${GITHUB_RUN_ATTEMPT}
          - Source Commit SHA: ${GITHUB_SHA}

          Notice: This APK is intended for testing only. It is not a Play Store production release and is signed only with a temporary debug keystore.
          EOF
          )

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "$GITHUB_SHA" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
          UPLOAD_OUTCOME: ${{ steps.prepare_asset.outcome }}
          RELEASE_TAG: ${{ steps.publish_release.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.publish_release.outputs.release_title }}
          ASSET_FILENAME: ${{ steps.prepare_asset.outputs.asset_filename }}
        run: |
          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq '.url')
            CONFIRMED_TAG=$(gh release view "$RELEASE_TAG" --json tagName --jq '.tagName')
            CONFIRMED_TITLE=$(gh release view "$RELEASE_TAG" --json name --jq '.name')
            CONFIRMED_ASSET=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[0].name')

            echo "Release Tag: ${CONFIRMED_TAG}"
            echo "Release Title: ${CONFIRMED_TITLE}"
            echo "Release Page URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${CONFIRMED_ASSET:-$ASSET_FILENAME}"

            {
              echo "### Debug APK Build & GitHub Release Succeeded"
              echo ""
              echo "- **Release Title:** ${CONFIRMED_TITLE}"
              echo "- **Release Tag:** \`${CONFIRMED_TAG}\`"
              echo "- **APK Asset Filename:** \`${CONFIRMED_ASSET:-$ASSET_FILENAME}\`"
              echo "- **GitHub Release URL:** ${RELEASE_URL}"
              echo ""
              echo "Download the \`.apk\` file directly from the **Assets** section on the GitHub Release page above. The normal Actions artifact \`app-debug-apk\` is also available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$PUBLISH_OUTCOME" = "failure" ]; then
            echo "::warning::GitHub Release publishing failed. The debug APK build succeeded and the Actions artifact 'app-debug-apk' remains available for download."

            {
              echo "### Debug APK Built (GitHub Release Publishing Failed)"
              echo ""
              echo "> **Warning:** Publishing to GitHub Releases failed, so no release URL was created."
              echo ""
              echo "- The debug APK build **succeeded**."
              echo "- Download the backup APK from the GitHub Actions workflow artifact named \`app-debug-apk\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Build or artifact preparation did not complete before release publishing (prepare step outcome: ${UPLOAD_OUTCOME}, publish step outcome: ${PUBLISH_OUTCOME})."
            {
              echo "### Debug APK Workflow Did Not Reach Release Publishing"
              echo ""
              echo "Check earlier build or verification steps for details."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
